<!DOCTYPE html>
<html lang="es" xml:lang="es">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>

<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-left-panel">
      <span class="auth-kicker"></span>
      <h1 class="auth-title">Iniciar sesión</h1>
      <p class="auth-subtitle">Elige cómo deseas iniciar sesión</p>

      <nav class="auth-top-tabs" aria-label="Acceso">
        <a class="auth-top-tab is-active" href="/auth/login.html">Iniciar sesión</a>
        <a class="auth-top-tab" href="/auth/register.html">Registrarse</a>
      </nav>

      <div class="auth-entity-switch" role="tablist" aria-label="Tipo de cuenta">
        <button id="login-entity-customer" class="auth-entity-btn is-active" type="button" onclick="setLoginEntity('customer')" aria-pressed="true">Iniciar como usuario</button>
        <button id="login-entity-company" class="auth-entity-btn" type="button" onclick="setLoginEntity('company')" aria-pressed="false">Iniciar como comercio</button>
      </div>

      <form class="auth-form" onsubmit="event.preventDefault(); login();">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" placeholder="correo@ejemplo.com" autocomplete="email">

        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="********" autocomplete="current-password">

        <button id="login-submit" class="auth-primary-btn" type="submit">Iniciar sesión como usuario →</button>
      </form>

      <a class="auth-link-inline" href="/auth/account-recovery.html">¿Olvidaste tu contraseña?</a>

      <div id="login-google-section" class="auth-google-block">
        <div id="google-signin-root"></div>
      </div>

      <a class="auth-secondary-btn" href="/index.html">← Volver al inicio</a>
      <p id="login-feedback" class="auth-feedback"></p>
    </section>

    <section class="auth-right-panel" aria-hidden="true">
      <div class="auth-right-visual"></div>
      <div class="auth-right-copy">
        <span class="auth-right-icon">🛒</span>
        <div>
          <h2>Tu ferretería con identidad propia</h2>
          <p>Accede a herramientas, productos y soluciones pensadas para hacer crecer tu negocio.</p>
        </div>
      </div>
    </section>
  </main>

  <input id="login-entity" type="hidden" value="customer">

  <div style="display:none">
    <select>
      <option value="customer">Customer</option>
      <option value="company">Company / Admin</option>
    </select>
  </div>

  <script src="/assets/js/js_front/utils/auth.js"></script>
  <script src="/assets/js/js_front/utils/global-header.js"></script>
  <script src="/assets/js/js_front/auth/google.js"></script>
  <script src="/assets/js/js_front/auth/login.js"></script>

</body>

</html>
