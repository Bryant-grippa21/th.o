<!DOCTYPE html>
<html lang="es" xml:lang="es">
<head>
  <title>Perfil</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/customer.css">
</head>
<body>

<main class="customer-page">
  <h1>Perfil</h1>

  <div id="customer-layout-nav">
    <p>Cargando navegación...</p>
  </div>

  <section class="customer-panel">
    <h2>Mis datos</h2>
    <p id="profile-feedback" class="customer-panel-feedback"></p>

    <section class="customer-profile-overview">
      <div class="customer-profile-avatar-block">
        <h3>Foto de perfil</h3>
        <div id="customer-image-preview">Cargando imagen...</div>

        <div class="customer-form-grid">
          <input id="customer-image" type="file" accept="image/*">
          <button type="button" onclick="uploadCustomerProfileImage()">Actualizar imagen</button>
        </div>
      </div>

      <div class="customer-profile-identity">
        <h3>Datos de cuenta</h3>
        <div class="customer-profile-meta-grid">
          <p><b>Nombre:</b> <span id="customer-name">No disponible</span></p>
          <p><b>Email:</b> <span id="customer-email">No disponible</span></p>
        </div>
      </div>
    </section>

    <div class="customer-profile-grid">
      <label>
        Teléfono
        <input id="phone" type="tel" placeholder="Teléfono">
      </label>

      <label>
        Dirección
        <input id="address" type="text" placeholder="Dirección">
      </label>

      <label class="customer-profile-grid__full">
        Nueva contraseña
        <input id="password" type="password" placeholder="Nueva contraseña">
      </label>
    </div>

    <div class="customer-panel-actions">
      <button type="button" onclick="update()">Actualizar datos</button>
    </div>
  </section>
</main>

<script src="/assets/js/js_front/utils/auth.js"></script>
<script src="/assets/js/js_front/utils/global-header.js"></script>
<script src="/assets/js/js_front/customer/layout.js"></script>
<script src="/assets/js/js_front/customer/profile.js"></script>

</body>
</html>
