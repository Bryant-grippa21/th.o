<!DOCTYPE html>
<html lang="es" xml:lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito</title>
</head>
<body>

<h1>Mi carrito</h1>
<div id="customer-layout-nav">
  <p>Cargando navegación...</p>
</div>

<p id="cart-summary">Cargando carrito...</p>
<label>
  <input id="cart-use-cashback" type="checkbox">
  Usar cashback disponible en esta compra
</label>
<p id="cart-cashback-summary">Cargando cashback...</p>
<div id="cart-actions">
  <button id="cart-checkout-button" type="button">Finalizar compra</button>
  <button id="cart-clear-button" type="button">Vaciar carrito</button>
</div>
<p id="cart-feedback"></p>
<div id="cart-list">
  <p>Cargando productos...</p>
</div>

<script src="/assets/js/utils/auth.js"></script>
<script src="/assets/js/customer/layout.js"></script>
<script src="/assets/js/customer/cart.js"></script>

</body>
</html>
