<!DOCTYPE html>
<html lang="es" xml:lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/customer.css">
</head>
<body>

<main class="customer-page">
  <h1>Mi carrito</h1>

  <div id="customer-layout-nav">
    <p>Cargando navegación...</p>
  </div>

  <section class="customer-panel">
    <p id="cart-summary" class="customer-panel-message">Cargando carrito...</p>
    <label class="customer-field customer-field--checkbox">
      <input id="cart-use-cashback" type="checkbox">
      Usar cashback disponible en esta compra
    </label>
    <p id="cart-cashback-summary" class="customer-panel-message">Cargando cashback...</p>
    <div id="cart-actions" class="customer-actions-row">
      <button id="cart-checkout-button" type="button">Finalizar compra</button>
      <button id="cart-clear-button" type="button" class="customer-button-secondary">Vaciar carrito</button>
    </div>
    <p id="cart-feedback" class="customer-panel-feedback"></p>
    <div id="cart-list">
      <p>Cargando productos...</p>
    </div>
  </section>
</main>

<script src="/assets/js/js_front/utils/auth.js"></script>
<script src="/assets/js/js_front/utils/global-header.js"></script>
<script src="/assets/js/js_front/customer/layout.js"></script>
<script src="/assets/js/js_front/customer/cart.js"></script>

</body>
</html>
