<!DOCTYPE html>
<html lang="es" xml:lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cotizaciones B2B mayorista</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/company.css">
</head>
<body>

<main class="company-page company-wholesaler-page">
  <h1>Cotizaciones B2B (Mayorista)</h1>
  <div id="company-layout-nav"></div>

  <p id="b2b-wholesaler-summary" class="company-panel-message">Cargando información...</p>
  <p id="b2b-wholesaler-feedback" class="company-panel-feedback"></p>

  <section class="company-panel">
    <h2>Solicitudes y cotizaciones entrantes</h2>
    <p class="company-panel-note">Haz clic en "Ver detalle" para revisar los productos solicitados, responder con precios y cantidades, o rechazar la solicitud con una nota.</p>
    <div id="b2b-wholesaler-filters" style="border:1px solid #ced4da; padding:12px; border-radius:10px; margin-bottom:16px; display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); align-items:end;">
      <label style="display:flex; flex-direction:column; gap:4px;">
        Estado
        <select id="b2b-wholesaler-filter-status">
          <option value="">Todos</option>
          <option value="REQUESTED">Solicitadas</option>
          <option value="QUOTED">Cotizadas</option>
          <option value="PAYMENT_PENDING">Pendientes</option>
          <option value="REVIEW">Pendiente por revisar</option>
          <option value="OVERDUE">Mora</option>
          <option value="PAID">Pagadas</option>
          <option value="REJECTED">Rechazadas</option>
        </select>
      </label>
      <label style="display:flex; flex-direction:column; gap:4px;">
        Desde
        <input id="b2b-wholesaler-filter-from" type="date">
      </label>
      <label style="display:flex; flex-direction:column; gap:4px;">
        Hasta
        <input id="b2b-wholesaler-filter-to" type="date">
      </label>
      <label style="display:flex; flex-direction:column; gap:4px;">
        Detallista
        <input id="b2b-wholesaler-filter-retailer" type="text" placeholder="Nombre del detallista">
      </label>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <button id="b2b-wholesaler-filter-apply" type="button">Aplicar filtros</button>
        <button id="b2b-wholesaler-filter-clear" type="button">Limpiar filtros</button>
      </div>
    </div>
    <div id="b2b-wholesaler-quotes-list"><p>Cargando cotizaciones...</p></div>
    <div id="b2b-wholesaler-pagination" style="margin-top:16px;"></div>
  </section>
</main>

<script src="/assets/js/js_front/utils/auth.js"></script>
<script src="/assets/js/js_front/utils/global-header.js"></script>
<script src="/assets/js/js_front/company/layout.js"></script>
<script src="/assets/js/js_front/company/b2b-wholesaler.js"></script>

</body>
</html>
